[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hd-sms"
version = "1.0.0"
description = "Hierarchical Delta Sparse Merkle Structuring - executable prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Muhammad Shahid" }
]
keywords = ["blockchain", "sparse merkle tree", "authenticated data structures",
            "delta encoding", "micro-fraction transfers", "layer-2 rollups"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<10.0"]

[project.urls]
Repository = "https://github.com/blockchain2030/Hierarchical-Delta-Sparse-Merkle-Structuring-HD-SMS-"

[tool.setuptools.packages.find]
include = ["simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
